<dialog class="pop" id="pop" lang="ru" aria-labelledby="pop-title">
  <div class="pop-head">
    <span class="pop-ic" id="pop-ic" aria-hidden="true"></span>
    <div><p class="kick" id="pop-kick"></p><h3 id="pop-title" tabindex="-1"></h3></div>
    <button type="button" class="x" id="pop-x" aria-label="Закрыть"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" fill="none"/></svg></button>
  </div>
  <div class="pop-body" id="pop-body"></div>
  <div class="pop-nav">
    <button type="button" class="btn" id="pop-prev" aria-label="Предыдущая карточка">←</button>
    <span id="pop-count"></span>
    <button type="button" class="btn" id="pop-next" aria-label="Следующая карточка">→</button>
  </div>
</dialog>
